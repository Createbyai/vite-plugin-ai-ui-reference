<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="description" content="UU 远程伴侣设置页静态预览。无需安装插件或运行开发服务器。">
  <title>UU 远程伴侣 · 设置页预览</title>
  <style>
    :root{font-family:"DM Sans","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20252d;background:#f4f5f7;font-synthesis:none;text-rendering:optimizeLegibility;--blue:#1683f7;--line:#e6e8ec}
    *{box-sizing:border-box}body{margin:0;min-width:360px;min-height:100vh;background:#f4f5f7;font-size:13px}.app-shell{width:min(100%,1120px);min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 40px #1720330a;position:relative;overflow:hidden}.topbar{height:48px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid #eff0f2;gap:12px;background:#fff}.brand-mark{width:19px;height:19px;border-radius:6px;background:linear-gradient(145deg,#ffb33d,#f36d26);display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;box-shadow:0 2px 4px #ff8d3038}.brand-name{font-size:14px;font-weight:700;letter-spacing:.1px}.top-title{color:#777f8b;margin-left:3px}.window-actions{margin-left:auto;display:flex;gap:15px;color:#9299a3;font-size:15px}.window-actions span{width:14px;text-align:center}.hero{height:178px;background:linear-gradient(180deg,#fff 0%,#fcfcfd 100%);padding:17px 46px 10px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;position:relative}.step{height:146px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.device-art{height:92px;width:150px;display:grid;place-items:center;position:relative;color:#1784fb}.device-art svg{overflow:visible}.step-label{font-weight:600;font-size:13px;margin-top:1px}.flow{position:absolute;top:55px;width:18%;border-top:1.5px dashed #8d939c}.flow:after{content:"";position:absolute;right:-1px;top:-5px;width:8px;height:8px;border-top:1.5px solid #8d939c;border-right:1.5px solid #8d939c;transform:rotate(45deg)}.flow.one{left:25.7%}.flow.two{left:56%}.life-ring{width:71px;height:71px;border:8px solid #cbd0d6;border-radius:50%;position:relative;box-shadow:inset 0 0 0 4px #fff,0 0 0 1px #d5d9de}.life-ring:before,.life-ring:after{content:"";position:absolute;inset:-8px 20px;background:#cbd0d6;border-radius:5px}.life-ring:after{transform:rotate(90deg)}.hero-note{position:absolute;top:4px;left:20px;font-size:10px;color:#b4b9c0}.hero-step-action{border:0;background:transparent;color:#1683f7;font:inherit;padding:3px 5px;cursor:pointer;border-radius:4px}.hero-step-action:hover{background:#edf6ff}.content-card{margin:0 26px 15px;background:#f7f7f8;border:1px solid #eceef0;border-radius:10px;padding:14px 17px 16px;min-height:372px;box-shadow:0 2px 5px #121b2a06}.section-heading{display:flex;align-items:center;gap:10px}.section-heading h1{font-size:16px;line-height:1.3;margin:0;font-weight:700;color:#282d35}.heading-spacer{flex:1}.source-link{color:#707987;background:#fff;border:1px solid #e8e9ec;border-radius:5px;padding:6px 10px;white-space:nowrap;cursor:pointer;font:inherit}.source-link:hover{border-color:#b9d8ff;color:#1678df}.intro{margin:8px 0 10px;color:#888f99;font-size:12px}.separator{height:1px;background:#e8e9ec;margin:12px 0 10px}.device-group{margin-bottom:9px}.group-title{display:flex;gap:6px;align-items:center;margin:0 0 4px;font-size:12px;font-weight:650;color:#454b54}.chevron{font-size:10px;color:#656d78}.group-count{color:#959ba5;font-size:11px;font-weight:400}.helper{font-size:11px;color:#858c96;margin:1px 0 7px}.device-row{display:grid;grid-template-columns:minmax(150px,1.25fr) minmax(260px,2fr) minmax(205px,1.5fr);align-items:center;gap:10px;background:#fff;border:1px solid #e9ebee;border-radius:7px;min-height:47px;padding:5px 9px;margin:5px 0;box-shadow:0 1px 2px #1a23300a}.device-name{display:flex;align-items:center;gap:9px;min-width:0;font-size:13px}.device-icon{height:27px;width:27px;border-radius:6px;background:#1683f7;display:grid;place-items:center;color:white;flex:0 0 auto}.device-icon.android{background:#1186df}.device-icon svg{width:18px;height:18px}.resolution-controls{display:flex;align-items:center;gap:5px;min-width:0}.segmented{display:flex;align-items:center;padding:1px;background:#f2f3f5;border:1px solid #e6e8eb;border-radius:5px;white-space:nowrap}.segmented button{border:0;background:transparent;font:inherit;font-size:11px;padding:5px 8px;color:#575e68;border-radius:4px;cursor:pointer;white-space:nowrap}.segmented button.active{background:#1683f7;color:#fff;box-shadow:0 1px 2px #1676d944}.dimension{width:53px;height:27px;text-align:center;border:1px solid #e4e6e9;border-radius:4px;font:inherit;font-size:12px;color:#343b45;background:#fff}.dimension:disabled{color:#9ba1aa;background:#f4f5f6}.multiply{color:#a4aab3}.unit{color:#838b96;font-size:11px;white-space:nowrap}.quality{display:flex;align-items:center;gap:7px;justify-content:flex-end;color:#505762;white-space:nowrap;font-size:11px}.quality label{display:flex;align-items:center;gap:3px;cursor:pointer}.quality input{accent-color:#1683f7;margin:0}.inner-scroll{max-height:none;overflow:visible;padding-right:3px}.footer{height:82px;border-top:1px solid #eff0f2;display:flex;align-items:flex-start;padding:10px 27px;gap:8px;position:relative;background:#fff}.footer button{height:32px;padding:0 11px;border:1px solid #e4e6e9;border-radius:5px;background:#fff;color:#727a85;font:inherit;font-size:12px;cursor:pointer}.footer button:hover{color:#1683f7;border-color:#aed5ff}.footer .footer-spacer{flex:1}.footer .exit{border-color:#f0d4d4;color:#a56a6a}.bottom-links{position:absolute;right:26px;bottom:8px;display:flex;gap:16px;color:#8e949d;font-size:11px}.bottom-links button{border:0;padding:0;height:auto;background:transparent;color:inherit;font-size:11px}.action-toast{position:fixed;z-index:20;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 14px;border-radius:7px;background:#222b38;color:#fff;font-size:12px;box-shadow:0 6px 20px #0003}.preview-note{position:fixed;z-index:5;left:12px;bottom:12px;padding:7px 10px;border:1px solid #e6e8ec;border-radius:6px;background:#ffffffed;color:#6e7783;font-size:11px;box-shadow:0 2px 8px #1720330d}
    @media(max-width:820px){.hero{padding-left:10px;padding-right:10px}.flow.one{left:25%}.flow.two{left:57%}.content-card{margin-left:12px;margin-right:12px;padding:12px}.device-row{grid-template-columns:minmax(125px,1fr) minmax(0,1.5fr)}.quality{grid-column:2;justify-content:flex-start}.hero-note{display:none}}
    @media(max-width:560px){.topbar{padding:0 12px}.hero{height:150px}.step{transform:scale(.84)}.device-art{height:80px}.flow{top:47px}.section-heading{align-items:flex-start;flex-wrap:wrap}.heading-spacer{display:none}.source-link{margin-left:auto}.device-row{grid-template-columns:1fr;gap:7px}.quality{grid-column:auto;justify-content:flex-start;padding-left:35px}.resolution-controls{flex-wrap:wrap;padding-left:35px}.inner-scroll{max-height:none}.footer{padding:10px 12px}.bottom-links{right:12px}.footer button{padding:0 7px;font-size:11px}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><div class="brand-mark">UU</div><span class="brand-name">UU 远程伴侣</span><span class="top-title">设置</span><div class="window-actions" aria-hidden="true"><span>—</span><span>□</span><span>×</span></div></header>
    <section class="hero" aria-label="设置步骤">
      <div class="hero-note">UU 远程伴侣 设置</div>
      <div class="step"><div class="device-art"><svg width="116" height="82" viewBox="0 0 116 82" fill="none" aria-hidden="true"><rect x="5" y="8" width="77" height="58" rx="8" fill="#d6eaff" stroke="#0879ea" stroke-width="5"/><path d="M28 65v5h32" stroke="#0879ea" stroke-width="4" stroke-linecap="round"/><rect x="70" y="30" width="31" height="47" rx="6" fill="#edf7ff" stroke="#1683f7" stroke-width="4"/><path d="M81 69h9" stroke="#1683f7" stroke-width="2" stroke-linecap="round"/></svg></div><span class="step-label">你的平板和手机</span><button class="hero-step-action" data-toast="当前步骤：设置平板和手机">⌃ 设置平板和手机</button></div>
      <div class="flow one" aria-hidden="true"></div>
      <div class="step"><div class="device-art"><svg width="111" height="82" viewBox="0 0 111 82" fill="none" aria-hidden="true"><rect x="15" y="8" width="81" height="57" rx="7" fill="#cde5ff" stroke="#0879ea" stroke-width="5"/><path d="M7 66h97l-8 9H16l-9-9Z" fill="#1683f7"/><path d="M47 66v4h18v-4" fill="#dbeeff"/></svg></div><span class="step-label">这台 Mac</span><button class="hero-step-action" data-toast="当前设备：这台 Mac">⌄ 设置这台 Mac</button></div>
      <div class="flow two" aria-hidden="true"></div>
      <div class="step"><div class="device-art"><div class="life-ring"></div></div><span class="step-label">万一屏幕没了</span><button class="hero-step-action" data-toast="打开找回屏幕的方法">⌄ 找回屏幕的方法</button></div>
    </section>
    <section class="content-card" aria-label="为已登录设备设置虚拟屏幕分辨率">
      <div class="section-heading"><h1>为已登录 UU 远程的设备指定虚拟屏幕分辨率</h1><span class="heading-spacer"></span><button class="source-link" data-toast="设备列表已是最新">从 UU 远程导入已登录设备列表</button></div>
      <p class="intro">已从 UU 远程导入 6 台设备（不含这台 Mac），并已自动保存。</p><div class="separator"></div>
      <div class="inner-scroll">
        <section class="device-group"><h2 class="group-title"><span class="chevron">⌄</span>电脑 <span class="group-count">2</span></h2>
          <article class="device-row" data-device="M1" data-icon="apple" data-mode="undefined" data-width="" data-height="" data-lock="true" data-hidpi="false"></article>
          <article class="device-row" data-device="mini" data-icon="apple" data-mode="undefined" data-width="" data-height="" data-lock="true" data-hidpi="false"></article>
        </section>
        <section class="device-group"><h2 class="group-title"><span class="chevron">⌄</span>手机/平板 <span class="group-count">4</span></h2><p class="helper">不知道屏幕分辨率？可以问问 AI：iPad Air 11 英寸（M4）的屏幕物理分辨率是多少？把查到的数字填进来，单位是像素，大的数字填在前面。</p>
          <article class="device-row" data-device="iPad Air" data-icon="apple" data-mode="custom" data-width="2360" data-height="1640" data-lock="false" data-hidpi="true"></article>
          <article class="device-row" data-device="iPhone 17" data-icon="apple" data-mode="custom" data-width="2622" data-height="1206" data-lock="false" data-hidpi="true"></article>
          <article class="device-row" data-device="OPPO Pad 3 Pro" data-icon="android" data-mode="custom" data-width="3000" data-height="2120" data-lock="false" data-hidpi="true"></article>
          <article class="device-row" data-device="Android 手机" data-icon="android" data-mode="custom" data-width="2400" data-height="1080" data-lock="false" data-hidpi="false"></article>
        </section>
      </div>
    </section>
    <footer class="footer"><button data-toast="所有屏幕已恢复">▣　立即恢复所有屏幕</button><button data-toast="打开权限设置">◉　权限设置</button><button data-toast="打开功能介绍">✣　功能介绍</button><span class="footer-spacer"></span><div class="bottom-links"><button data-toast="UU 远程伴侣 1.0">关于 UU 远程伴侣</button><button class="exit" data-toast="演示版不会关闭应用">完全退出</button></div></footer>
    <div class="preview-note">静态页面预览 · 无需安装插件</div>
    <div class="action-toast" role="status" hidden></div>
  </main>
  <script>
    const apple = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 12.8c0-2.1 1.7-3.1 1.8-3.2a4 4 0 0 0-3.2-1.7c-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8a4.4 4.4 0 0 0-3.7 2.3c-1.6 2.8-.4 7 1.1 9.3.7 1.1 1.5 2.3 2.6 2.2 1-.1 1.4-.7 2.7-.7s1.7.7 2.8.7c1.1 0 1.8-1.1 2.5-2.3.8-1.3 1.1-2.5 1.1-2.5s-2.3-.9-2.3-4.1ZM14.4 6.5a3.9 3.9 0 0 0 .9-2.8 4 4 0 0 0-2.6 1.3 3.7 3.7 0 0 0-.9 2.7 3.4 3.4 0 0 0 2.6-1.2Z"/></svg>';
    const android = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5 5.5 2.5l.9-.5L8 4.5a9 9 0 0 1 8 0l1.6-2.5.9.5L17 5a8 8 0 0 1 3 6H4a8 8 0 0 1 3-6Zm-.5 8h11v7a2 2 0 0 1-2 2h-1v-4h-2v4h-2v-4h-2v4h-1a2 2 0 0 1-2-2v-7Zm1.5-4a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm8 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/></svg>';
    const rows = document.querySelectorAll('.device-row');
    for (const row of rows) {
      const name = row.dataset.device;
      const isApple = row.dataset.icon === 'apple';
      const mode = row.dataset.mode;
      row.innerHTML = `<div class="device-name"><span class="device-icon ${isApple ? '' : 'android'}">${isApple ? apple : android}</span><span>${name}</span></div><div class="resolution-controls"><div class="segmented" role="group" aria-label="${name}分辨率模式"><button type="button" data-mode="undefined" class="${mode === 'undefined' ? 'active' : ''}">无须定义</button><button type="button" data-mode="custom" class="${mode === 'custom' ? 'active' : ''}">自定义分辨率</button></div><input class="dimension" aria-label="${name}宽度" inputmode="numeric" value="${row.dataset.width}" placeholder="${name === 'M1' || name === 'mini' ? '注时不调整屏幕' : ''}" ${mode === 'undefined' ? 'disabled' : ''}><span class="multiply">×</span><input class="dimension" aria-label="${name}高度" inputmode="numeric" value="${row.dataset.height}" ${mode === 'undefined' ? 'disabled' : ''}><span class="unit">像素</span></div><div class="quality"><label><input type="checkbox" ${row.dataset.lock === 'true' ? 'checked' : ''}>锁定</label><label><input type="checkbox" ${row.dataset.hidpi === 'true' ? 'checked' : ''}>高清 (HiDPI)</label></div>`;
      row.querySelectorAll('.segmented button').forEach(button => button.addEventListener('click', () => {
        const custom = button.dataset.mode === 'custom';
        row.querySelectorAll('.segmented button').forEach(item => item.classList.toggle('active', item === button));
        row.querySelectorAll('.dimension').forEach(input => input.disabled = !custom);
      }));
    }
    const toast = document.querySelector('.action-toast');
    let toastTimer;
    document.querySelectorAll('[data-toast]').forEach(button => button.addEventListener('click', () => {
      toast.textContent = button.dataset.toast;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.hidden = true, 2200);
    }));
  </script>
</body>
</html>
